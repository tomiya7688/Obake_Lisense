name: Publish Obake Character License v1.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v1.1 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.1 already exists."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          # Obake Character License v1.1

          First formal GitHub release of the Obake Character License.

          ## Included

          - Japanese canonical license (`LICENSE.md`)
          - English translation (`LICENSE.en.md`)
          - Explicit statement that the Japanese version is canonical and prevails if interpretations differ
          - Official Kadoka and maru assets
          - Clear separation of sources of truth:
            - license and official distributed assets: `tomiya7688/Obake_Lisense`
            - official world and character settings: `tomiya7688/chatgpt-obakenosumika`

          The license terms remain **Obake Character License v1.1**. The English translation does not create a new license version.
          EOF

          gh release create v1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Obake Character License v1.1" \
            --notes-file /tmp/release-notes.md
