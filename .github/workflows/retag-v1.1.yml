name: Finalize Obake Character License v1.1 tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retag-v1.1.yml

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Move v1.1 tag to clean release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 431f0570426fb70caf2cbae3b66729c3ebd814b2
        run: |
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.1" \
            -f sha="$TARGET_SHA" \
            -F force=true

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/389059036" \
            -f target_commitish="$TARGET_SHA" >/dev/null
